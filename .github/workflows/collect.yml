name: Hourly Data Collection
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Collect CPCB
        run: python scripts/collect_cpcb.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          DATA_GOV_RESOURCE_ID: ${{ secrets.DATA_GOV_RESOURCE_ID }}
          CPCB_STATE: Maharashtra
          CPCB_CITY: Pune
      - name: Collect Weather
        run: python scripts/collect_weather.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
