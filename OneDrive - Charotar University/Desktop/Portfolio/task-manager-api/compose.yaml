
services:
  mongo:
    image: mongo:7
    container_name: task-manager-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: task-manager-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/taskmanager
    depends_on:
      - mongo

volumes:
  mongo_data:
